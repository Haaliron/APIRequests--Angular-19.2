<h1>{{dateTime() | date : "HH:mm:ss"}}</h1>

<app-form (created)="onCreated($event)"></app-form>

@if (postsResource.isLoading()) {
  <p>Yükleniyor...</p>
} @else {

  <app-main-card [selectedPost]="selectedPost()"></app-main-card>

  @for (post of postsResource.value(); track post.id) {
    <app-cards [post]="post" [(selectedPost)]="selectedPost"></app-cards>
  }
}
